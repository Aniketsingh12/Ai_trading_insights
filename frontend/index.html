<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MarketMind — AI Trading Analyst</title>

    <!-- PWA / mobile -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MarketMind" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      Two type roles. SG carries the interface and headlines; JB carries every
      number and anything machine-produced, so a figure never reads as prose.
      Loaded as @font-face rather than a stylesheet link so the SG/JB aliases
      are real families, and font-display:block avoids a flash of fallback
      metrics shifting the left-locked layout on first paint.
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      @font-face {
        font-family: 'SG';
        src: url(https://fonts.gstatic.com/s/spacegrotesk/v22/V8mDoQDjQSkFtoMM3T6r8E7mPb54C-s0.woff2) format('woff2');
        font-weight: 300 700;
        font-display: block;
      }
      @font-face {
        font-family: 'JB';
        src: url(https://fonts.gstatic.com/s/jetbrainsmono/v24/tDbv2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKwBNntkaToggR7BYRbKPx3cwhsk.woff2) format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
    </style>
  </head>
  <body class="bg-bg text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
