# Render.com blueprint for the MarketMind backend.
# Deploy: push to GitHub → render.com → New → Blueprint → pick this repo.
# Secrets (sync:false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: marketmind-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # ── LLM (hosted, no GPU needed) ──
      # Default: Groq (openai_compat). For Google Gemini instead, set
      #   LLM_PROVIDER=gemini  and  GEMINI_API_KEY=<key from aistudio.google.com/apikey>
      - key: LLM_PROVIDER
        value: openai_compat
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_API_KEY          # free key from console.groq.com
        sync: false
      - key: OPENAI_MODEL_QUICK
        value: llama-3.1-8b-instant
      - key: OPENAI_MODEL_AGENT
        value: llama-3.3-70b-versatile
      - key: OPENAI_MODEL_REPORT
        value: llama-3.3-70b-versatile
      - key: GEMINI_API_KEY          # only needed if LLM_PROVIDER=gemini
        sync: false
      # ── CORS: set to your deployed frontend URL(s), comma-separated ──
      - key: CORS_ORIGINS           # e.g. https://marketmind.vercel.app,https://localhost,capacitor://localhost
        sync: false
      # ── Abuse guards: this URL is public, so cap the LLM/screener routes ──
      - key: RATE_LIMIT_PER_MIN
        value: "20"
      - key: API_ACCESS_KEY         # optional; if set, callers must send X-API-Key
        sync: false
      # ── Optional data-provider keys (app works without them) ──
      - key: NEWSAPI_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
