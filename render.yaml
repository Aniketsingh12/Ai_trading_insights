# Render.com blueprint for the TradeForge backend.
# Deploy: push to GitHub → render.com → New → Blueprint → pick this repo.
# Secrets (sync:false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: tradeforge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # ── LLM (hosted, no GPU needed) ──
      # Default: Groq (openai_compat). For Google Gemini instead, set
      #   LLM_PROVIDER=gemini  and  GEMINI_API_KEY=<key from aistudio.google.com/apikey>
      - key: LLM_PROVIDER
        value: openai_compat
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_API_KEY          # free key from console.groq.com
        sync: false
      - key: OPENAI_MODEL_QUICK
        value: llama-3.1-8b-instant
      - key: OPENAI_MODEL_AGENT
        value: llama-3.3-70b-versatile
      - key: OPENAI_MODEL_REPORT
        value: llama-3.3-70b-versatile
      - key: GEMINI_API_KEY          # only needed if LLM_PROVIDER=gemini
        sync: false
      # ── CORS: set to your deployed frontend URL(s), comma-separated ──
      - key: CORS_ORIGINS           # e.g. https://tradeforge.vercel.app,https://localhost,capacitor://localhost
        sync: false
      # ── Optional data-provider keys (app works without them) ──
      - key: NEWSAPI_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
