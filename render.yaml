# Render.com blueprint for the MarketMind backend.
# Deploy: push to GitHub → render.com → New → Blueprint → pick this repo.
# Secrets (sync:false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: marketmind-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # ── LLM (hosted, no GPU needed) ──
      # Default: Together AI — just paste a key from api.together.ai.
      - key: LLM_PROVIDER
        value: together
      - key: TOGETHER_API_KEY        # required — key from api.together.ai
        sync: false
      - key: TOGETHER_MODEL_QUICK
        value: openai/gpt-oss-20b
      - key: TOGETHER_MODEL_AGENT
        value: deepseek-ai/DeepSeek-V4-Flash-0731
      # One call, but ~85% of a deep run's cost. See scripts/eval_report_model.py.
      - key: TOGETHER_MODEL_REPORT
        value: openai/gpt-oss-120b
      # ── Alternative: Google Gemini (free) — set LLM_PROVIDER=gemini ──
      - key: GEMINI_API_KEY          # free key from aistudio.google.com/apikey
        sync: false
      # ── Alternative provider (Groq) — only used if you set LLM_PROVIDER=openai_compat ──
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_API_KEY          # free key from console.groq.com
        sync: false
      - key: OPENAI_MODEL_QUICK
        value: llama-3.1-8b-instant
      - key: OPENAI_MODEL_AGENT
        value: llama-3.3-70b-versatile
      - key: OPENAI_MODEL_REPORT
        value: llama-3.3-70b-versatile
      # ── CORS: baseline covers local/Capacitor use; APPEND your Vercel URL after step 4 ──
      - key: CORS_ORIGINS
        value: https://localhost,capacitor://localhost,http://localhost
      # ── Public demo: visitors may run the AI features, metered, with a cap ──
      # Deep research costs 5 units, so VISITOR_LLM_LIMIT must stay >= 5.
      - key: VISITOR_LLM_LIMIT      # AI runs one visitor gets per UTC day
        value: "10"
      - key: DAILY_LLM_LIMIT        # ceiling across ALL visitors — bounds the bill
        value: "60"
      - key: RATE_LIMIT_PER_MIN     # per-IP burst cap (data routes get 8x)
        value: "30"
      - key: API_ACCESS_KEY         # your passcode; bypasses both limits
        sync: false
      # ── Optional data-provider keys (app works without them) ──
      - key: NEWSAPI_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
